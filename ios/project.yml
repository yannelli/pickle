name: LittleDill
options:
  bundleIdPrefix: com.littledill
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  LittleDill:
    type: application
    platform: iOS
    sources: [LittleDill]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.littledill.ios
        INFOPLIST_FILE: LittleDill/Info.plist
        CODE_SIGN_ENTITLEMENTS: LittleDill/LittleDill.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets: [LittleDillTests, LittleDillUITests]
  LittleDillTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LittleDillTests]
    dependencies:
      - target: LittleDill
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LittleDillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LittleDillUITests]
    dependencies:
      - target: LittleDill
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
